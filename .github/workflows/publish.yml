name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Build
        run: uv build

      - name: Check the tag matches mosfit.__version__
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version="$(uv run --no-project --with ./dist/mosfit-*.whl \
            python -c 'import mosfit; print(mosfit.__version__)')"
          if [ "$tag" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match __version__ $version" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    name: Upload to PyPI
    needs: build
    # Tags only, and only from this repository, so forks never try to publish.
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'guillochon/MOSFiT'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: pypi
    permissions:
      # Trusted publishing (https://docs.pypi.org/trusted-publishers/) mints a
      # short-lived token from this OIDC claim; no PyPI secret is stored here.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

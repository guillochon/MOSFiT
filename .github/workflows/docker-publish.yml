name: Build and push MOSFiT image

# Builds the MOSFiT CPU runtime image. The image is pushed to Docker Hub ONLY
# from master (and version tags) AND only where the DOCKERHUB_TOKEN secret is set,
# so forks and other branches / pull requests just build (a broken image fails the
# check without publishing, and a fork without the secret won't fail on login). From Docker Hub the
# CVMFS unpacked sync (a separate PR against opensciencegrid/cvmfs-singularity-sync)
# mirrors it to /cvmfs/singularity.opensciencegrid.org/<user>/mosfit:<tag>.
#
# Needs repo secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN. The default image
# is CPU-only (emcee/dynesty + optional mpi); PyTorch/sedona is not installed.

on:
  push:
    branches: [master, docker]
    tags: ["v*"]
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - mosfit/**
      - pyproject.toml
      - uv.lock
      - README.md
      - LICENSE
      - .github/workflows/docker-publish.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Publish only from master/tags AND only where the Docker Hub secret is set, so
    # forks (without the secret) build-only instead of failing the login step.
    env:
      PUBLISH: ${{ (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        env:
          # Full target image (e.g. an org: "someorg/mosfit"). Falls back to
          # <login user>/mosfit when the repo variable isn't set.
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          if [ "$PUBLISH" = "true" ]; then
            repo="${DOCKERHUB_IMAGE:-${DOCKERHUB_USERNAME}/mosfit}"
            echo "tags=${repo}:latest,${repo}:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          else
            # Build-only (branches / PRs, no push): a valid local tag is enough,
            # and this doesn't depend on any secrets/vars being set.
            echo "tags=mosfit:ci" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
